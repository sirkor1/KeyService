server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка приватного SSH-ключа — единственный крупный запрос,
    # и тот в пределах десятков килобайт.
    client_max_body_size 64k;

    # Инлайновых стилей и скриптов в сборке нет, поэтому unsafe-inline не нужен.
    # Шрифты берутся с Google Fonts — единственный внешний источник.
    add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Проверка SSH-подключения к узлу занимает десятки секунд:
        # с дефолтными 60с запрос отваливался бы в 504.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Заготовка под поток прогресса установки: SSE не работает с буферизацией.
    location /api/jobs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Наружу карта эндпоинтов не нужна.
    location /swagger {
        return 404;
    }

    # Имена файлов сборки содержат хеш — кешируются навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой маршрут отдаёт index.html, роутинг разбирает клиент.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
